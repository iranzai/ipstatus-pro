<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ipstatuspro</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" width="25" height="25" />
    <strong>ip<span>status</span>pro</strong>
    <button class="icon-button" id="refresh" type="button" aria-label="重新检测">↻</button>
  </header>

  <main>
    <div class="eyebrow"><i id="state-dot"></i><span>CURRENT BROWSER EXIT</span><b id="state-label">正在检测</b></div>
    <section class="ip-summary">
      <small>当前出口 IP</small>
      <div class="ip-value-row"><strong id="ip-address">正在读取…</strong><button class="copy-ip" id="copy-ip" type="button" title="复制 IP" aria-label="复制当前出口 IP">⧉</button></div>
      <select id="ip-version" aria-label="选择 IPv4 或 IPv6 出口"><option value="">正在检测</option></select>
    </section>

    <section class="profile-grid" aria-label="IP 基础信息">
      <div class="wide"><small>ASN</small><strong class="profile-line"><span id="asn">--</span><span id="company">--</span></strong></div>
      <div><small>定位</small><strong id="country">--</strong></div>
      <div><small>类型</small><strong id="ip-nature">--</strong></div>
      <div><small>地区</small><strong id="city">--</strong></div>
      <div><small>经纬度</small><strong id="coordinates">--</strong></div>
    </section>

    <p class="error" id="error" hidden></p>
    <button class="primary-button" id="open-page" type="button">流媒体检测 <span>→</span></button>
    <p class="note">IPv4 与 IPv6 出口会分别探测；未显示的协议表示当前网络或代理没有返回对应出口。</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
